[project]
name = "clip-demo"
version = "0.1.0"
description = "CLIP image<->text matching demo (Jupyter notebook + module)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "open-clip-torch>=2.24",
    "pillow>=10.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "ipywidgets>=8.1",
    "jupyterlab>=4.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
